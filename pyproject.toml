[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signatus"
version = "0.1.0"
description = "Signatus v1 edge worksite access-screening system"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.3",
  "uvicorn[standard]==0.52.4",
  "websockets==16.1.1",
]

[project.optional-dependencies]
gui = [
  "PySide6==6.11.2",
]
ai = [
  "numpy==2.5.2",
  "opencv-python==4.14.0.94",
  "openvino==2026.3.0",
  "PyYAML==6.0.3",
  "ultralytics==8.4.123",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.3",
]

[project.scripts]
signatus-gui = "signatus_gui.app:main"
signatus-launch = "signatus_launcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
